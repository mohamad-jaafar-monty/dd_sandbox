sonar.projectKey=mohamad-jaafar-monty_dd_sandbox
sonar.organization=mohamad-jaafar-monty
sonar.python.version=3.12

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=dd_sandbox
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
# Everything is analysed, so the deliberately bad files report their issues.
# They are only left out of the coverage figure, which stays about the
# application code. No sonar.tests: declaring it alone empties the default
# source set, and together with sonar.sources=. the tests folder is indexed
# twice and the scanner aborts.
sonar.coverage.exclusions=tests/**,torture/**,duplication_probe_*.py,sonar_flags_demo.py
